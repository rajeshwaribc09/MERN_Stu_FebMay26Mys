<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metric snapshot strip</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-gray-100 p-6">
  <div class="bg-white p-6 rounded-lg shadow m-6">
    <div class="inline-flex items-center">
      <div class="m-4">
        <p class="tracking-wide">Active Users</p>
        <p class="text-xl font-bold leading-relaxed">12,480</p>
        <span class="bg-green-100 p-1 rounded-full inline-flex items-center">
          Up
        </span>
      </div>
      <div class="m-4">
        <p class="tracking-wide">Requests / Min</p>
        <p class="text-xl font-bold leading-relaxed">1,240</p>
        <span class="bg-blue-100 p-1 rounded-full inline-flex items-center">
          Stable
        </span>
      </div>
      <div class="m-4">
        <p class="tracking-wide">Error Rate</p>
        <p class="text-xl font-bold leading-relaxed">2.1%</p>
        <span class="bg-red-100 p-1 rounded-full inline-flex items-center">
          Down
        </span>
      </div>
      <div class="m-4">
        <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg shadow">
          Download Report
        </button>
      </div>
    </div>
    <div class="bg-red-100 border-l-4 border-red-500 p-3 m-4 leading-relaxed">
      Scheduled maintenance tonight may briefly affect dashboard updates.
    </div>
</div>
</body>
</html>
