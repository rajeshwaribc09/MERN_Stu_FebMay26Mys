<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Selectors and grouping selector</title>
    <style>
         /* grouping selector */
         h1,h3{
            color: chartreuse;
         }
         /* Universal selectors */
        *{
            margin: 0;
            color: aquamarine;
            padding: 0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
    </style>

</head>
<body>
    <h2>All elements have zero margin and zero padding</h2>
    <p>paragraph 1</p>
    <h1>heading 1</h1>
    <h3>heading 3</h3>
</body>
</html>
