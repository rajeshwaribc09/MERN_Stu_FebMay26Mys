<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid columns</title>
    <style>
     .grid-fraction{
            display: grid;
            grid-template-columns: repeat(3,1fr); /*3 equal cos*/
            gap: 10px;
            margin: 10px;
        }
         .grid-item{
            background-color: aquamarine;
            color: black;
            padding: 20px;
        }
    </style>
</head>
<body>
    
    <!-- Fixed width column using fractional column -->
    <div class="grid-fraction">
        <div class="grid-item">1</div>
        <div class="grid-item">2</div>
        <div class="grid-item">3</div>
    
    </div>

</body>
</html>
