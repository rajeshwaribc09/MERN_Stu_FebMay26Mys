<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning elments:static</title>
    <style>
        .box{
            position: static;
            width: 150px;
            height: 100px;
            background-color: aquamarine;
             border: 2px solid black;
             border-radius: 20px ;
             box-shadow: 5px 4px black; 
             color: brown;
             margin: 10px;
             text-align: center;
        }
        body{
            background-color: blue;
        }
    </style>
</head>
<body>
    <h2>Static Position</h2>
    <div class="box">static Box</div>
</body>
</html>
