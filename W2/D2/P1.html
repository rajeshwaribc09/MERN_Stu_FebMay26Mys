<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Basics</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<!-- 50,100,.....900 -->
<body class="bg-yellow-200">
    <p class="text-red-500">Hello Tailwind CSS</p>
    <h2 class="text-blue-600 p-4 mt-4">Utility Class  1</h2>
    <h3 class="text-blue-600 pb-4 mb-4 bg-blue">Utility Class 2</h3>
    <h4 class="text-blue-600 px-4  py-6 m-4 bg-red-500">Utility Class 3</h4>
    <div class="border-8 bg-purple-500 border-pink-800 rounded-t-full/sm/lg">Name</div>
    <p class="text">My text</p> <!--sm/base/lg/xl/2xl/3xl-->
    <p class="text-bold">My text</p> <!--light/normal/bold-->
    <p class="text-center">My text</p> <!--left/center/right-->
    <button class="hover:text-red-600 hover:bg-green-400">click me</button>
    <!-- success:green,error:red,warning:yellow,information:blue -->
    <div class="bg-green-900 p-4">
        <p class="font-bold">success message</p>
        <p>this is a success message</p>
    </div>
    <span class="inline-flex items-center bg-green-600 text-blue-900 px-3 py-1 rounded-full">new</span>
    <div class="border p-6 rounded m-6">
        <h3 class="font-bold text-xl">Card Title</h3>
        <p>This is the simple description inside the card</p>
    </div>
</body>
</html>
